<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ticket Confirmed - RailReserve</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<header>

    <div class="logo">
        🚆 RailReserve
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#search">
            Book Another
        </a>

    </nav>

</header>



<main class="ticket-page">


    <div class="success-icon">
        ✓
    </div>


    <p class="tag">
        BOOKING CONFIRMED
    </p>


    <h1>
        Your ticket is confirmed!
    </h1>


    <p class="ticket-subtitle">
        Your railway reservation has been successfully
        saved to the system.
    </p>



    <div class="ticket-card">


        <div class="ticket-top">

            <div>

                <span>
                    PNR NUMBER
                </span>

                <strong id="pnr">
                    ------
                </strong>

            </div>


            <div class="confirmed">
                ✓ CONFIRMED
            </div>

        </div>


        <div class="ticket-divider"></div>


        <div class="ticket-details">

            <div>

                <span>PASSENGER</span>

                <strong id="passenger">
                    --
                </strong>

            </div>


            <div>

                <span>TRAIN</span>

                <strong id="train">
                    --
                </strong>

            </div>


            <div>

                <span>FROM</span>

                <strong id="from">
                    --
                </strong>

            </div>


            <div>

                <span>TO</span>

                <strong id="to">
                    --
                </strong>

            </div>


            <div>

                <span>CLASS</span>

                <strong id="class">
                    --
                </strong>

            </div>


            <div>

                <span>FARE</span>

                <strong>
                    ₹<span id="fare">--</span>
                </strong>

            </div>

        </div>


    </div>



    <a
        href="index.html"
        class="home-btn">

        ← Back to Home

    </a>


</main>


<script src="js/ticket.js"></script>

</body>

</html>
